# Copy to ~/.config/rct/config.ini and chmod 600 it; rct refuses a file others can read.
# ROCKETCHAT_URL, ROCKETCHAT_USER_ID and ROCKETCHAT_TOKEN override these values,
# and with all three set the file is optional.
# `rct doctor` shows which source each value came from and tests the login.

[rocketchat]
# The server root, as in the browser; include the path if Rocket.Chat lives under one.
url = https://chat.example.com
# A personal access token: avatar → Account → Personal Access Tokens. The user ID
# is shown once next to the new token. Tick "Ignore Two Factor Authentication"
# if your account uses 2FA.
user_id = paste-user-id-here
token = paste-token-here
# ca_bundle = /path/to/ca.pem
# timeout = 30
# Longest wait, in seconds, for a rate limit to reset before a request gives up.
# rate_limit_wait = 60
